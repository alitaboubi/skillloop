<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SkillLoop</title>
  <!-- No background: the loop sits on the browser's tab bar. Colours follow the browser/OS light or dark mode so the
       lime spark never disappears on a light tab bar (lime #b4f24e on white is only 1.3:1). -->
  <style>
    .loop { stroke: #ad4216; }
    .spark { stroke: #5d9300; }
    @media (prefers-color-scheme: dark) {
      .loop { stroke: #ed905e; }
      .spark { stroke: #b4f24e; }
    }
  </style>
  <g transform="translate(1.5 15.5) scale(1.79)" fill="none" stroke-width="3.6">
    <path class="loop" d="M9 2a7 7 0 1 0 0 14c4 0 6-3.5 8-7s4-7 8-7a7 7 0 1 1 0 14c-4 0-6-3.5-8-7S13 2 9 2Z"/>
    <path class="spark" d="M25 2c-4 0-6 3.5-8 7" stroke-linecap="round"/>
  </g>
</svg>
